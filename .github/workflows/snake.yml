name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: https-sfs
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#67E8F9&color_dots=#E2E8F0,#BAE6FD,#7DD3FC,#38BDF8,#0EA5E9
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#67E8F9&color_dots=#1E293B,#164E63,#155E75,#0891B2,#0E7490
      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: dist
