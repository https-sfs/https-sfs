<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2172 180" width="2172" height="180">
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#9FE8FF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#9FE8FF" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#D7F7FF" stop-opacity="0.95"/>
      <stop offset="0.8" stop-color="#9FE8FF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#9FE8FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- subtle checkpoint grid -->
  <g stroke="#A9E9FF" stroke-width="1" opacity="0.16">
    <path d="M0 45H2172 M0 90H2172 M0 135H2172"/>
    <path d="M180 0V180 M420 0V180 M660 0V180 M900 0V180 M1140 0V180 M1380 0V180 M1620 0V180 M1860 0V180 M2100 0V180"/>
  </g>

  <!-- soft technical wave -->
  <path d="M0 100 C180 55 360 55 540 100 S900 145 1080 100 S1440 55 1620 100 S1980 145 2172 100"
        fill="none" stroke="url(#line)" stroke-width="3" opacity="0.72" filter="url(#glow)">
    <animate attributeName="d"
      values="M0 100 C180 55 360 55 540 100 S900 145 1080 100 S1440 55 1620 100 S1980 145 2172 100;
              M0 100 C180 145 360 145 540 100 S900 55 1080 100 S1440 145 1620 100 S1980 55 2172 100;
              M0 100 C180 55 360 55 540 100 S900 145 1080 100 S1440 55 1620 100 S1980 145 2172 100"
      dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- moving checkpoint nodes -->
  <g fill="#B9F0FF" filter="url(#glow)">
    <circle cx="180" cy="100" r="4">
      <animate attributeName="cx" values="180;1990;180" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="100;80;100" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="100" r="3">
      <animate attributeName="cx" values="900;2120;900" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="100;125;100" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- central checkpoint marker -->
  <g transform="translate(1086 90)" opacity="0.85">
    <circle r="13" fill="none" stroke="#A9E9FF" stroke-width="1.5"/>
    <circle r="4" fill="#D7F7FF">
      <animate attributeName="r" values="3;6;3" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
