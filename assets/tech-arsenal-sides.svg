<svg width="1100" height="700" viewBox="0 0 1100 700"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- LEFT SIDE -->
  <g
    fill="none"
    stroke="#67E8F9"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.75"
  >
    <path d="M15 80 H145 V115 H225"/>
    <path d="M5 200 H90 V165 H215"/>
    <path d="M20 320 H140 V355 H230"/>
    <path d="M5 450 H105 V415 H220"/>
    <path d="M25 575 H150 V610 H235"/>
  </g>

  <!-- RIGHT SIDE -->
  <g
    fill="none"
    stroke="#67E8F9"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.75"
  >
    <path d="M1085 80 H955 V115 H875"/>
    <path d="M1095 200 H1010 V165 H885"/>
    <path d="M1080 320 H960 V355 H870"/>
    <path d="M1095 450 H995 V415 H880"/>
    <path d="M1075 575 H950 V610 H865"/>
  </g>

  <!-- BRIGHT NODES -->
  <g fill="#67E8F9" filter="url(#glow)">

    <circle cx="145" cy="80" r="3"/>
    <circle cx="90" cy="200" r="3"/>
    <circle cx="140" cy="320" r="3"/>
    <circle cx="105" cy="450" r="3"/>
    <circle cx="150" cy="575" r="3"/>

    <circle cx="955" cy="80" r="3"/>
    <circle cx="1010" cy="200" r="3"/>
    <circle cx="960" cy="320" r="3"/>
    <circle cx="995" cy="450" r="3"/>
    <circle cx="950" cy="575" r="3"/>

  </g>

  <!-- MOVING PULSES -->
  <g fill="#B8F7FF" filter="url(#glow)">

    <circle cy="115" r="3.5">
      <animate
        attributeName="cx"
        values="20;225;20"
        dur="3.5s"
        repeatCount="indefinite"/>
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="3.5s"
        repeatCount="indefinite"/>
    </circle>

    <circle cy="355" r="3.5">
      <animate
        attributeName="cx"
        values="230;20;230"
        dur="4.2s"
        repeatCount="indefinite"/>
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="4.2s"
        repeatCount="indefinite"/>
    </circle>

    <circle cy="610" r="3.5">
      <animate
        attributeName="cx"
        values="25;235;25"
        dur="4s"
        repeatCount="indefinite"/>
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="4s"
        repeatCount="indefinite"/>
    </circle>

    <circle cy="115" r="3.5">
      <animate
        attributeName="cx"
        values="1080;875;1080"
        dur="3.8s"
        repeatCount="indefinite"/>
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="3.8s"
        repeatCount="indefinite"/>
    </circle>

    <circle cy="355" r="3.5">
      <animate
        attributeName="cx"
        values="870;1080;870"
        dur="4.5s"
        repeatCount="indefinite"/>
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="4.5s"
        repeatCount="indefinite"/>
    </circle>

    <circle cy="610" r="3.5">
      <animate
        attributeName="cx"
        values="1075;865;1075"
        dur="4.1s"
        repeatCount="indefinite"/>
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="4.1s"
        repeatCount="indefinite"/>
    </circle>

  </g>

</svg>
