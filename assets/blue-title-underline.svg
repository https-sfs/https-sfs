<svg width="90" height="8" viewBox="0 0 90 8" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67E8F9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line
    x1="0"
    y1="4"
    x2="90"
    y2="4"
    stroke="#67E8F9"
    stroke-opacity="0.18"
    stroke-width="1"
  />

  <rect
    x="-25"
    y="2"
    width="25"
    height="4"
    rx="2"
    fill="url(#pulse)"
  >
    <animate
      attributeName="x"
      from="-25"
      to="90"
      dur="2.2s"
      repeatCount="indefinite"
    />
  </rect>

</svg>
