<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2172 420" width="2172" height="420">
<defs>
  <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="typingClip">
    <rect x="610" y="278" width="0" height="34">
      <animate attributeName="width" from="0" to="950" dur="4.2s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
</defs>

<!-- Header-style matrix environment -->
<rect width="2172" height="420" fill="#07111F"/>

<g stroke="#24485F" stroke-width="1" opacity="0.62">
  <path d="M0 35H2172"/><path d="M0 77H2172"/><path d="M0 119H2172"/>
  <path d="M0 161H2172"/><path d="M0 203H2172"/><path d="M0 245H2172"/>
  <path d="M0 287H2172"/><path d="M0 329H2172"/><path d="M0 371H2172"/>
  <path d="M72 0V420"/><path d="M180 0V420"/><path d="M288 0V420"/>
  <path d="M396 0V420"/><path d="M504 0V420"/><path d="M612 0V420"/>
  <path d="M720 0V420"/><path d="M828 0V420"/><path d="M936 0V420"/>
