<rect x="170" y="45" width="1832" height="330" rx="18" fill="#0A1624" stroke="#2B5067" stroke-width="1.5"/>

<!-- top chrome -->
<circle cx="198" cy="73" r="6" fill="#FF6B6B"/>
<circle cx="220" cy="73" r="6" fill="#FFD166"/>
<circle cx="242" cy="73" r="6" fill="#70D6A5"/>
<text x="280" y="79" fill="#8FA8B8" font-family="monospace" font-size="18">shafia.dev  ·  developer workspace</text>

