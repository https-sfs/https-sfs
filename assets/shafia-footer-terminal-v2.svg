<circle cx="756" cy="244" r="5" fill="#67E8F9" filter="url(#glow)">
  <animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/>
</circle>

<text x="625" y="292" fill="#67E8F9" font-family="monospace" font-size="18">$</text>
<text x="652" y="292" fill="#CBD5E1" font-family="monospace" font-size="18">echo</text>
