<svg width="170" height="650" viewBox="0 0 170 650" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0.45"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <g fill="none" stroke="url(#line)" stroke-width="1">

    <path d="M10 80 H75 V110 H145"/>
    <path d="M0 210 H45 V180 H120"/>
    <path d="M20 350 H85 V320 H155"/>
    <path d="M0 485 H55 V515 H135"/>
    <path d="M25 590 H100 V565 H165"/>

  </g>

  <g fill="#67E8F9">

    <circle cx="75" cy="80" r="2"/>
    <circle cx="45" cy="210" r="2"/>
    <circle cx="85" cy="350" r="2"/>
    <circle cx="55" cy="485" r="2"/>
    <circle cx="100" cy="590" r="2"/>

    <circle cy="110" r="2.5" filter="url(#glow)">
      <animate attributeName="cx"
        values="20;145;20"
        dur="4s"
        repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values="0.15;0.9;0.15"
        dur="4s"
        repeatCount="indefinite"/>
    </circle>

    <circle cy="320" r="2.5" filter="url(#glow)">
      <animate attributeName="cx"
        values="155;20;155"
        dur="4.8s"
        repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values="0.15;0.8;0.15"
        dur="4.8s"
        repeatCount="indefinite"/>
    </circle>

  </g>

</svg>
