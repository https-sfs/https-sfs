<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 120" width="1400" height="120">
<defs>
  <filter id="g" x="-20%" y="-100%" width="140%" height="300%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="type">
    <rect x="0" y="0" width="0" height="70">
      <animate attributeName="width" values="0;0;850;850;0" keyTimes="0;.08;.62;.82;1" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
</defs>
<text x="700" y="72" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="42" font-weight="600" filter="url(#g)" clip-path="url(#type)">Let's build something meaningful.</text>
<rect x="275" y="38" width="3" height="44" fill="#67E8F9" filter="url(#g)">
  <animate attributeName="x" values="275;275;1125;1125;275" keyTimes="0;.08;.62;.82;1" dur="5.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;1;1;0;1" keyTimes="0;.08;.62;.82;1" dur="5.5s" repeatCount="indefinite"/>
</rect>
</svg>